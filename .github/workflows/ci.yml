name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --all-extras pulls streamlit/pandas/scikit-learn so the gui and ml
      # tests run instead of skipping. Requires discopt>=0.6 on PyPI.
      - run: uv sync --python 3.12 --all-extras
      - run: uv run pytest tests/ -q
