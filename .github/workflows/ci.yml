name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --all-extras pulls streamlit/pandas/scikit-learn/matplotlib so the gui
      # and ml tests run instead of skipping. discopt>=0.6 is resolved from the
      # pinned git rev in [tool.uv.sources], not PyPI (see pyproject.toml).
      - run: uv sync --python 3.12 --all-extras
      - run: uv run pytest tests/ -q
