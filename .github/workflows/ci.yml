name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Run the exact same pre-commit hooks developers run locally, so lint/format
  # enforcement never drifts between local and CI.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --all-extras pulls streamlit/pandas/scikit-learn/matplotlib so the gui
      # and ml tests run instead of skipping.
      - run: uv sync --python ${{ matrix.python-version }} --all-extras
      - run: uv run pytest tests/ -q

  # Core install (no optional extras): the ml/gui-dependent tests must skip,
  # not fail, so a plain install stays usable.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run pytest tests/ -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12 --all-extras
      # -W turns Sphinx warnings (broken cross-refs, missing citations) into
      # build failures so doc rot is caught in CI.
      - run: uv run jupyter-book build docs/ -W

  # The browser app, exercised in real WebAssembly. This is the only job where
  # neither the base `discopt` package nor jax is installed — which is the whole
  # point: it is the one place a stray module-level import of either can be
  # caught. tests/test_import_hygiene.py simulates the same conditions in-process
  # and runs everywhere; this proves the real thing works end to end.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --python 3.12
      - name: Build the browser bundle
        run: uv run python scripts/build_web_app.py -o docs/_build/web
      - name: Install the test harness
        run: npm ci
        working-directory: web
      # No browser and no network: app.js against a stub DOM and a stub
      # Pyodide, checking that dropping a workbook analyses it and that an
      # unusable one says what to fix.
      - name: Run the front-end test
        run: node test-dom.mjs
        working-directory: web
      # Fetches the numpy/scipy wheels from the Pyodide CDN and openpyxl from
      # PyPI on first run.
      - name: Run the WebAssembly end-to-end test
        run: node test-wasm.mjs ../docs/_build/web
        working-directory: web
      # The real page against real WebAssembly, once per design type. This is
      # the only job where the two halves have to agree: a mixture design that
      # cannot import its own constraint helpers passes every other test.
      - name: Fuzz every design type through the app
        run: node test-fuzz.mjs ../docs/_build/web 2
        working-directory: web
