name: publish

# Build the sdist + wheel and upload them to PyPI when a GitHub release is
# published.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      # Fail early on broken metadata / long-description before we try to upload.
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # OIDC trusted publishing: no API token is stored. The `pypi` environment must
  # be registered as a trusted publisher on PyPI (see the setup steps in CLAUDE.md).
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
