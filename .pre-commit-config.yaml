# Pre-commit hooks. Install locally with `uv run pre-commit install`.
# CI runs the exact same hooks via the `lint` job in .github/workflows/ci.yml
# (`uvx pre-commit run --all-files`), so local and CI enforcement never drift.
#
# Ruff config (line length, target version, per-file ignores, and the
# docs/notebooks exclude) lives in pyproject.toml under [tool.ruff].
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev in sync with the ruff version resolved by uv.
    rev: v0.14.6
    hooks:
      - id: ruff          # lint (auto-fixes what it safely can)
        args: [--fix]
      - id: ruff-format   # formatting

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
